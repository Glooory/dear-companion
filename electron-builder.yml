appId: com.glooory.dearcompanion
productName: Dear Companion
directories:
  output: release
  buildResources: build
files:
  - out/**
extraResources:
  - from: resources/tray
    to: tray
    filter:
      - "*.png"
asar: true
artifactName: Dear-Companion-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.lifestyle
  identity: null
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Dear Companion uses the microphone only when you record a local companion dialogue voice.
  target:
    - dmg
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
