appId: com.glooory.dearcompanion
productName: 挚伴
directories:
  output: release
  buildResources: build
files:
  - out/**
extraResources:
  - from: resources/tray
    to: tray
    filter:
      - "*.png"
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.lifestyle
  identity: null
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: 挚伴仅在录制对白声音时使用麦克风。
  target:
    - dmg
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
