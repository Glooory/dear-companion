name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/validate-release-tag.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  build_windows_x64:
    needs: validate_tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run icons:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build Windows x64 installer
        run: npx electron-builder --win --x64 --publish never
      - name: Smoke packaged Windows executable
        shell: pwsh
        run: |
          $executable = "release\win-unpacked\挚伴.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            $executable = "release\win-unpacked\Dear Companion.exe"
          }
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Packaged executable is missing in release\win-unpacked"
          }
          $env:DEAR_COMPANION_BUILD_SMOKE = "1"
          $process = Start-Process -FilePath $executable -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable exited with $($process.ExitCode)"
          }
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: dear-companion-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  build_macos_intel:
    needs: validate_tag
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run icons:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build macOS Intel DMG
        run: npx electron-builder --mac --x64 --publish never
      - name: Smoke and verify macOS Intel executable
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release -maxdepth 2 -type d \( -name "挚伴.app" -o -name "Dear Companion.app" \) -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm +111 -print -quit 2>/dev/null || find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -x "$executable"
          file "$executable" | grep -q "x86_64"
          DEAR_COMPANION_BUILD_SMOKE=1 "$executable"
          set -- release/*.dmg
          test "$#" -eq 1
          test -f "$1"
      - uses: actions/upload-artifact@v7
        with:
          name: dear-companion-macos-intel
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  build_macos_arm64:
    needs: validate_tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run icons:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build macOS Apple Silicon DMG
        run: npx electron-builder --mac --arm64 --publish never
      - name: Smoke and verify macOS Apple Silicon executable
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find release -maxdepth 2 -type d \( -name "挚伴.app" -o -name "Dear Companion.app" \) -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm +111 -print -quit 2>/dev/null || find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -x "$executable"
          file "$executable" | grep -q "arm64"
          DEAR_COMPANION_BUILD_SMOKE=1 "$executable"
          set -- release/*.dmg
          test "$#" -eq 1
          test -f "$1"
      - uses: actions/upload-artifact@v7
        with:
          name: dear-companion-macos-arm64
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  create_draft_release:
    needs: [build_windows_x64, build_macos_intel, build_macos_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: dear-companion-*
          path: artifacts
          merge-multiple: true
      - name: Verify artifacts and create checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find artifacts -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" \) -print0 | sort -z)
          test "${#installers[@]}" -eq 3
          test "$(find artifacts -maxdepth 1 -type f -name "*-win-x64.exe" | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name "*-mac-x64.dmg" | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name "*-mac-arm64.dmg" | wc -l)" -eq 1
          (cd artifacts && sha256sum ./*.exe ./*.dmg > SHA256SUMS.txt)
          cp docs/installing-unsigned.md artifacts/INSTALLING-UNSIGNED.md
          {
            echo "# 挚伴 (Dear Companion) $RELEASE_TAG"
            echo
            echo "### 安装包下载 / Downloads"
            echo "- **macOS (Apple Silicon 芯片)**: \`Zhiban-${RELEASE_TAG#v}-mac-arm64.dmg\`"
            echo "- **macOS (Intel 芯片)**: \`Zhiban-${RELEASE_TAG#v}-mac-x64.dmg\`"
            echo "- **Windows (64位)**: \`Zhiban-${RELEASE_TAG#v}-win-x64.exe\`"
            echo
            echo "### macOS 首次打开提示“已损坏”解决方法"
            echo "若 macOS 提示应用“已损坏，无法打开”，将应用拖入“应用程序”后，在终端执行以下命令即可正常打开："
            echo "\`\`\`bash"
            echo "xattr -cr /Applications/挚伴.app"
            echo "\`\`\`"
            echo
            echo "安装前请先核对 SHA256SUMS.txt，详细安装说明见 INSTALLING-UNSIGNED.md。"
          } > artifacts/RELEASE-NOTES.md
      - name: Create or update draft GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          mapfile -d '' installers < <(find artifacts -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" \) -print0 | sort -z)
          existing="$(gh release view "$tag" --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            gh release delete-asset "$tag" --yes -- "-${RELEASE_TAG#v}-mac-arm64.dmg" 2>/dev/null || true
            gh release delete-asset "$tag" --yes -- "-${RELEASE_TAG#v}-mac-x64.dmg" 2>/dev/null || true
            gh release delete-asset "$tag" --yes -- "-${RELEASE_TAG#v}-win-x64.exe" 2>/dev/null || true
            gh release edit "$tag" --title "挚伴 (Dear Companion) $tag" --notes-file artifacts/RELEASE-NOTES.md
            gh release upload "$tag" "${installers[@]}" artifacts/SHA256SUMS.txt artifacts/INSTALLING-UNSIGNED.md --clobber
          else
            gh release create "$tag" "${installers[@]}" artifacts/SHA256SUMS.txt artifacts/INSTALLING-UNSIGNED.md \
              --draft --verify-tag --title "挚伴 (Dear Companion) $tag" --notes-file artifacts/RELEASE-NOTES.md
          fi
